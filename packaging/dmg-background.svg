<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="78%">
      <stop offset="0%" stop-color="#171615"/>
      <stop offset="58%" stop-color="#0b0b0a"/>
      <stop offset="100%" stop-color="#030303"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c0804" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#4a0402" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4b0302"/>
      <stop offset="48%" stop-color="#9e0b06"/>
      <stop offset="100%" stop-color="#570402"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1000" height="420" fill="url(#bg)"/>

  <!-- Grime and concrete seams -->
  <g opacity="0.35" stroke="#3d3b37" fill="none">
    <path d="M0 78 C120 72 190 91 300 83 S510 67 660 84 S860 76 1000 86" stroke-width="1"/>
    <path d="M0 330 C130 337 240 318 370 332 S600 347 760 326 S900 333 1000 325" stroke-width="1"/>
    <path d="M72 0 L84 420" stroke-width="0.7"/>
    <path d="M921 0 L909 420" stroke-width="0.7"/>
  </g>
  <g opacity="0.28" fill="#a29a8d">
    <circle cx="58" cy="64" r="1.4"/><circle cx="114" cy="132" r="0.9"/>
    <circle cx="174" cy="44" r="1.1"/><circle cx="267" cy="376" r="1.3"/>
    <circle cx="348" cy="51" r="0.8"/><circle cx="477" cy="383" r="1.0"/>
    <circle cx="612" cy="361" r="1.2"/><circle cx="710" cy="57" r="0.8"/>
    <circle cx="812" cy="389" r="1.1"/><circle cx="943" cy="62" r="1.3"/>
    <circle cx="872" cy="122" r="0.8"/><circle cx="52" cy="351" r="1.0"/>
  </g>

  <!-- Blood halos under the two drop targets -->
  <ellipse cx="210" cy="222" rx="155" ry="130" fill="url(#halo)"/>
  <ellipse cx="790" cy="222" rx="155" ry="130" fill="url(#halo)"/>

  <!-- Torn blood splatter across the header -->
  <g fill="#590403">
    <path d="M184 16 C219 3 256 12 285 5 C314 0 341 10 363 5 L365 22 C328 30 299 19 270 26 C239 34 211 26 184 31 Z" opacity="0.76"/>
    <path d="M650 18 C688 8 722 17 750 10 C780 4 810 11 836 7 L839 20 C810 28 783 22 756 28 C728 35 699 30 672 35 C658 30 650 25 650 18 Z" opacity="0.68"/>
    <circle cx="143" cy="28" r="5" opacity="0.7"/>
    <circle cx="367" cy="45" r="2.4" opacity="0.6"/>
    <circle cx="630" cy="25" r="4" opacity="0.7"/>
    <circle cx="846" cy="43" r="2.2" opacity="0.6"/>
  </g>

  <!-- Header -->
  <text x="500" y="64" text-anchor="middle" fill="#7c0905" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" letter-spacing="7">NOT TO LOVE</text>
  <text x="500" y="86" text-anchor="middle" fill="#88837a" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="5">THE BASEMENT</text>

  <!-- Hand-painted drag arrow -->
  <g fill="none" stroke="url(#arrow)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M338 220 C390 207 430 231 475 217 C514 205 549 227 589 216 C613 210 632 214 650 220" stroke-width="7"/>
    <path d="M626 201 L654 220 L625 239" stroke-width="7"/>
  </g>
  <g fill="#8f0905">
    <path d="M374 234 C378 245 376 255 379 265 C381 272 387 272 387 264 C386 252 383 242 380 234 Z" opacity="0.9"/>
    <path d="M507 226 C510 239 508 250 511 259 C514 266 520 264 519 257 C518 245 514 235 512 226 Z" opacity="0.85"/>
    <circle cx="557" cy="245" r="2.5" opacity="0.8"/>
    <circle cx="350" cy="236" r="1.8" opacity="0.7"/>
  </g>

  <!-- Floor pool under the drop targets -->
  <path d="M0 340 C110 326 184 344 282 336 C380 328 448 348 540 337 C632 326 730 350 826 335 C896 324 953 338 1000 331 L1000 420 L0 420 Z" fill="#0a0706" opacity="0.95"/>
  <path d="M0 348 C144 339 232 354 354 345 C448 338 522 351 610 344 C714 335 830 353 1000 341" fill="none" stroke="#3b0704" stroke-width="2" opacity="0.55"/>

  <!-- Instructions -->
  <text x="500" y="370" text-anchor="middle" fill="#a29a8d" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2.8">DRAG THE APP INTO APPLICATIONS</text>
  <text x="500" y="395" text-anchor="middle" fill="#5c574f" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1.7">UNSIGNED BUILD — RIGHT-CLICK THE APP AND CHOOSE OPEN</text>

  <!-- Drips at the edges -->
  <g fill="#5f0503" opacity="0.8">
    <path d="M28 0 C26 30 32 47 30 78 C29 88 35 90 37 79 C40 51 35 25 37 0 Z"/>
    <path d="M966 0 C970 28 964 49 968 69 C970 77 975 76 975 67 C974 41 978 22 976 0 Z"/>
    <circle cx="33" cy="98" r="2.2"/>
    <circle cx="966" cy="91" r="1.7"/>
  </g>
</svg>
